[extra]
brand = "GRK2868-F1"
author = "GRK 2868 F1 Project"
github = "https://github.com/grk2868f1"
# key 是 [translations] 里的键；path 相对当前语言的首页（模板会补上 /、/en/ 或 /de/）
radion_menu = [
    {key = "home", path = ""},
    {key = "posts", path = "posts/"},
    {key = "categories", path = "categories/"},
    {key = "tags", path = "tags/"},
]

# Nicer codeblocks with copy to clipboard
codeblock = true

# Enable MathJax support
latex = true

# Enable search bar
enable_search = true

# Light/Dark Mode set
theme = "toggle" # options: {light, dark, auto, toggle}

# Whether to display favicon
favicon = true

# 多语言映射：切换菜单的顺序、按钮简称与菜单全称、<html lang>、og:locale、各语言首页路径、posts section 文件
[extra.i18n]
order = ["en", "zh", "de"]
label = {zh = "中", en = "en", de = "de"}
# 下拉菜单里显示的全称，每种语言用它自己的写法
name = {zh = "中文", en = "English", de = "Deutsch"}
html_lang = {zh = "zh-CN", en = "en", de = "de"}
og_locale = {zh = "zh_CN", en = "en_US", de = "de_DE"}
root = {en = "/", zh = "/zh/", de = "/de/"}
posts_index = {en = "posts/_index.md", zh = "posts/_index.zh.md", de = "posts/_index.de.md"}
