base_url = "https://grk2868f1.github.io"
compile_sass = true
title = "GRK 2868 F1 Archive"
description = "Research notes and archive of the GRK 2868 F1 subproject"
generate_feeds = true
# 默认语言为英文：英文页面不带前缀；中文、德文页面在 /zh/、/de/ 下（见 [languages.*]）。
# 语言由文件名决定：index.md（英文）/ index.zh.md / index.de.md
default_language = "en"

taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

# When set to "true", a search index is built from the pages and section
# content for `default_language`.
build_search_index = true

[markdown]
# This determines whether to insert a link for each header like the ones you can see on this site if you hover over
# a header.
# The default template can be overridden by creating an `anchor-link.html` file in the `templates` directory.
# This value can be "left", "right", "heading" or "none".
# "heading" means the full heading becomes the text of the anchor.
# See "Internal links & deep linking" in the documentation for more information.
insert_anchor_links = "heading"

# Zola 0.22+ 把高亮主题放在嵌套表 [markdown.highlighting] 下；
# `one-dark-pro` 输出的 inline 色值与 sass/parts/_code.scss 浅色 token 一一对应。
[markdown.highlighting]
theme = "one-dark-pro"
style = "inline"
extra_grammars = ["syntaxes/fortran_free-form.tmLanguage.json"]

[search]
# fuse_json 不依赖分词器，默认语言 zh 也能建索引（elasticlunr_json 不支持 zh）
index_format = "fuse_json"
# 每页只索引正文前 2000 字符，控制 search_index.<lang>.json 体积
truncate_content_length = 2000

[languages.zh]
title = "GRK 2868 F1 Archive"
description = "GRK 2868 F1 子项目的研究笔记与资料存档"
generate_feeds = true
build_search_index = true
taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

[languages.de]
title = "GRK 2868 F1 Archive"
description = "Forschungsnotizen und Archiv des Teilprojekts GRK 2868 F1"
generate_feeds = true
build_search_index = true
taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

